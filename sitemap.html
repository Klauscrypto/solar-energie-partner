<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SITEMAP // SOLAR RADIKAL</title>
<meta name="description" content="Alle Seiten von Solar Energie Partner auf einen Blick." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="radikal-base.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="subpage-shell.jsx"></script>
<script type="text/babel">
const { Page, PageHero, Section, Cta, Marquee, COL, fonts } = window.RadShell;

const tree = [
  {
    title: "STARTSEITE",
    sub: "Hauptseite",
    color: COL.yellow,
    items: [
      ["index.html", "Solar Radikal — Startseite", "★ HAUPTSEITE", "live"],
    ],
  },
  {
    title: "LEISTUNGEN",
    sub: "Produktseiten",
    color: COL.cyan,
    items: [
      ["photovoltaik.html", "Photovoltaik — Anlagen-Bau", "/photovoltaik", "live"],
      ["speicher.html", "Speicher — Batteriesysteme", "/speicher", "live"],
      ["waermepumpe.html", "Wärmepumpe — Heiztechnik", "/waermepumpe", "live"],
      ["ppa.html", "PPA-Stromvertrag — Strom als Service", "/ppa", "live"],
    ],
  },
  {
    title: "WISSEN",
    sub: "Beratung & Preise",
    color: COL.pink,
    items: [
      ["foerderung.html", "Förderung — KfW, BAFA, Land", "/foerderung", "live"],
      ["preise.html", "Preise — Beispielrechnungen", "/preise", "live"],
      ["blog.html", "Blog — Artikel & Magazin", "/blog", "live"],
    ],
  },
  {
    title: "FIRMA",
    sub: "Über uns & Standort",
    color: COL.orange,
    items: [
      ["ueber-uns.html", "Über uns — Story & Inhaberin", "/ueber-uns", "live"],
      ["referenzen.html", "Referenzen — 250+ Anlagen", "/referenzen", "live"],
      ["standort-deggendorf.html", "Standort Deggendorf — Hauptsitz", "/standorte/deggendorf", "live"],
    ],
  },
];

const todoPages = [
  ["kontakt.html", "Kontakt-Formular", "Geplant"],
  ["impressum.html", "Impressum", "Geplant"],
  ["datenschutz.html", "Datenschutz", "Geplant"],
  ["referenz-detail.html", "Referenz-Detailseite", "Geplant"],
  ["blog-detail.html", "Blog-Artikel-Detailseite", "Geplant"],
  ["faq.html", "FAQ-Übersichtsseite", "Geplant"],
];

function App() {
  return (
    <Page active="">
      <PageHero
        kapitel="META"
        kicker="ALLE_SEITEN"
        title="SITEMAP"
        italicPart="—"
        blackHeadlinePart="ALLES_DA."
        sub="Jede Seite, jede Variante, jeder Mock — sortiert nach Bereich. Damit du nichts übersiehst."
        color={COL.cyan}
        accentColor={COL.pink}
      />

      <Marquee items={["28 SEITEN", "5 KONZEPT-VARIANTEN", "★ ALLE LIVE", "STAND // 2026"]} />

      {tree.map((sec, si) => (
        <Section key={si} kapitel={`BEREICH_${String(si+1).padStart(2,"0")}`} title={sec.title} italicPart={sec.sub} blackPart="" color={sec.color}>
          <div style={{ background: COL.white, border: `3px solid ${COL.black}` }}>
            {sec.items.map(([href, label, tag, status], i) => (
              <a key={i} href={href} className="lift" style={{
                display: "grid",
                gridTemplateColumns: "60px 2fr 1fr 100px 60px",
                alignItems: "center",
                borderBottom: i < sec.items.length-1 ? `1px solid ${COL.black}` : "none",
                textDecoration: "none", color: COL.black,
              }}>
                <div style={{ background: sec.color, padding: "16px 12px", borderRight: `1px solid ${COL.black}`, fontFamily: fonts.mono, fontSize: 11, fontWeight: 700, textAlign: "center" }}>
                  {String(i+1).padStart(2,"0")}
                </div>
                <div style={{ padding: "16px 20px" }}>
                  <div style={{ fontFamily: fonts.heading, fontSize: 20, fontWeight: 800, textTransform: "uppercase", letterSpacing: "-0.02em", lineHeight: 1.05 }}>{label}</div>
                  <div style={{ fontFamily: fonts.mono, fontSize: 11, opacity: 0.6, marginTop: 4 }}>► {href}</div>
                </div>
                <div style={{ padding: "16px 20px", fontFamily: fonts.mono, fontSize: 11, fontWeight: 700, color: tag.startsWith("★") ? COL.pink : COL.black }}>
                  {tag}
                </div>
                <div style={{ padding: "16px 12px", textAlign: "center" }}>
                  <span style={{ background: status === "live" ? COL.cyan : COL.orange, color: COL.black, padding: "4px 8px", fontFamily: fonts.mono, fontSize: 10, fontWeight: 700, border: `2px solid ${COL.black}`, textTransform: "uppercase" }}>● {status}</span>
                </div>
                <div style={{ padding: "16px 20px", fontFamily: fonts.heading, fontSize: 24, fontWeight: 800 }}>→</div>
              </a>
            ))}
          </div>
        </Section>
      ))}

      <Section kapitel="OFFEN" title="NOCH" italicPart="zu" blackPart="BAUEN." color={COL.black} blackHeadlineColor={COL.yellow}>
        <p style={{ fontFamily: fonts.serif, fontSize: 22, fontStyle: "italic", maxWidth: 720, marginBottom: 24, color: COL.yellow }}>
          Diese Seiten existieren als Wireframe-Idee, sind aber noch nicht gemockt. Für die nächste Iteration:
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
          {todoPages.map(([href, label, status], i) => (
            <div key={i} style={{ background: COL.yellow, color: COL.black, border: `3px solid ${COL.yellow}`, padding: 18, opacity: 0.5 }}>
              <div style={{ fontFamily: fonts.mono, fontSize: 10, fontWeight: 700, marginBottom: 6 }}>► {status.toUpperCase()}</div>
              <div style={{ fontFamily: fonts.heading, fontSize: 22, fontWeight: 800, textTransform: "uppercase", letterSpacing: "-0.02em", lineHeight: 1 }}>{label}</div>
              <div style={{ fontFamily: fonts.mono, fontSize: 10, marginTop: 6, opacity: 0.7 }}>{href}</div>
            </div>
          ))}
        </div>
      </Section>

      <Cta
        kicker="ZURÜCK_ZUM_START"
        big={<>NACH<br/><span style={{ background: COL.yellow, color: COL.black, padding: "0 .1em", display: "inline-block", transform: "skew(-4deg)" }}>HAUSE.</span></>}
        sub="Zur Hauptversion der Solar Radikal Website."
        btn="ZUR_STARTSEITE"
        href="index.html"
      />
    </Page>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
