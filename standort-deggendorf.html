<!doctype html>

</head>
<body>

      <Marquee items={["94469 DEGGENDORF", "DETTERSTR. 38", "BAYERISCHER WALD", "DONAU-NÄHE", "EINSATZ BUNDESWEIT"]} />

      <Section kapitel="ADRESSE" title="WO" italicPart="genau" blackPart="WIR_SITZEN." color={COL.yellow}>

        <div style={{ background: COL.white, border: `3px solid ${COL.black}` }}>

      <Section kapitel="DAS_TEAM" title="DAS" italicPart="team in" blackPart="DEGGENDORF." color={COL.cyan}>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 16 }}>
          {team.map(([fn, ln, role], i) => (
            <div key={i} className="lift" style={{ background: COL.white, border: `3px solid ${COL.black}`, padding: 0, transform: `rotate(${i%2?0.4:-0.4}deg)` }}>
              <div style={{ aspectRatio: "1/1", background: [COL.yellow, COL.pink, COL.cyan, COL.orange][i%4], borderBottom: `3px solid ${COL.black}`, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>

                <div style={{ position: "absolute", top: 8, left: 8, fontFamily: fonts.mono, fontSize: 10, fontWeight: 700, color: COL.black, background: COL.white, padding: "2px 6px", border: `1px solid ${COL.black}` }}>FOTO_{String(i+1).padStart(2,"0")}</div>
              </div>
              <div style={{ padding: 16 }}>
                <div style={{ fontFamily: fonts.heading, fontSize: 20, fontWeight: 800, lineHeight: 1, textTransform: "uppercase", letterSpacing: "-0.02em" }}>{fn}<br/>{ln}</div>

      </Section>

      <BigQuote
        quote="Deggendorf ist klein genug, dass jeder jeden kennt. Das hält uns ehrlich. Wenn wir pfuschen, weiß es übermorgen die ganze Stadt."
        by="Doris Pilsner-Albrecht"
        role="Inhaberin · seit 2014"
        color={COL.yellow}

      <Cta
        kicker="KOMM_VORBEI"
        big={<>BÜRO<br/><span style={{ background: COL.cyan, color: COL.black, padding: "0 .1em", display: "inline-block", transform: "skew(-4deg)" }}>OFFEN.</span></>}
        sub="Termin vereinbaren oder einfach mal vorbeischauen. Kaffee gibts immer."
        btn="TERMIN_BUCHEN"
      />

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
