<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PHOTOVOLTAIK // SOLAR RADIKAL</title>
<meta name="description" content="Photovoltaik-Anlagen aus Deggendorf für Bayern und Baden-Württemberg. Eigenes Team, Festpreis, kein Subunternehmer. Seit 2014." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="radikal-base.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="subpage-shell.jsx"></script>
<script type="text/babel">
const { Page, PageHero, Section, BigQuote, StatGrid, FeatureGrid, Cta, Marquee, COL, fonts } = window.RadShell;
const D = window.SITE_DATA;

const features = [
  { no: "01", tag: "Hardware", title: "Tier-1 Module", body: "Meyer Burger, Q CELLS, Trina, JinkoSolar. Wir wählen je nach Lastprofil — kein Hersteller-Schlampen." },
  { no: "02", tag: "Wechselrichter", title: "Smart & robust", body: "SMA, Fronius, Kostal, SolarEdge. Mit Monitoring-App auf deinem Handy. Du siehst, was deine Anlage gerade macht." },
  { no: "03", tag: "Montage", title: "Eigenes Team", body: "Eigene Dachdecker und Elektriker. Keine Subunternehmer. Anlage in 1–3 Tagen fertig (Eigenheim)." },
  { no: "04", tag: "Garantie", title: "25-30 J. Modul", body: "Modulgarantie bis 30 Jahre. Wechselrichter 10–12 Jahre. Plus unsere Werkstatt-Garantie auf die Montage." },
  { no: "05", tag: "Service", title: "Monitoring", body: "Wir sehen Probleme oft bevor du sie bemerkst. 24/7 Notfall-Hotline mit echten Menschen, nicht Warteschleife." },
  { no: "06", tag: "Förderung", title: "Wir machen das", body: "KfW-270, KfW-442, Landes- und Kommunalmittel. Wir prüfen, beantragen, streiten — du unterschreibst." },
];

const sizing = [
  { l: "EIGENHEIM 1-2 PERS.", v: "5–8", u: " kWp", s: "ca. 4.500 kWh / Jahr" },
  { l: "FAMILIE 4 PERS.", v: "8–12", u: " kWp", s: "ca. 6.500 kWh / Jahr" },
  { l: "GROSSHAUSHALT", v: "12–18", u: " kWp", s: "ca. 9.000 kWh / Jahr" },
  { l: "GEWERBE KLEIN", v: "30–100", u: " kWp", s: "Halle, Werkstatt" },
  { l: "GEWERBE GROSS", v: "100–999", u: " kWp", s: "Industriedach" },
];

function Why() {
  const items = [
    ["EIGENVERBRAUCH", "30 ct/kWh", "spart jede selbst genutzte kWh"],
    ["EINSPEISUNG", "8,11 ct", "garantiert über 20 Jahre (EEG)"],
    ["AMORTISATION", "9–13 J.", "typische Eigenheim-Anlage"],
    ["LEBENSDAUER", "30+ J.", "Module halten länger als Verträge"],
  ];
  return (
    <Section kapitel="WARUM JETZT" title="JETZT" italicPart="lohnt sich" blackPart="DOPPELT." color={COL.cyan}>
      <p style={{ fontFamily: fonts.serif, fontSize: 22, fontStyle: "italic", maxWidth: 720, marginBottom: 32 }}>
        Strompreise sind hoch, Modulpreise sind tief, Förderung läuft. Klassische Drei-Punkte-Konstellation für PV.
      </p>
      <StatGrid items={items.map(([l,v,s]) => ({l, v, s}))} color={COL.yellow} alt={COL.cyan} />
    </Section>
  );
}

function Sizing() {
  return (
    <Section kapitel="GRÖSSE" title="WIE GROSS?" italicPart="kommt drauf" blackPart="AN." color={COL.yellow}>
      <p style={{ fontFamily: fonts.serif, fontSize: 22, fontStyle: "italic", maxWidth: 720, marginBottom: 32 }}>
        Faustregel: pro 1.000 kWh Verbrauch ca. 1,2 kWp Anlage. Dazu Eigenverbrauchs-Quote, Speicher, E-Auto-Plan.
      </p>
      <StatGrid items={sizing} color={COL.pink} alt={COL.yellow} />
      <p style={{ fontFamily: fonts.mono, fontSize: 11, opacity: 0.6, marginTop: 16, textTransform: "uppercase" }}>
        ⚠ Werte sind Richtwerte. Genaue Auslegung in der Beratung — kostenfrei.
      </p>
    </Section>
  );
}

function Process() {
  return (
    <Section kapitel="ABLAUF" title="VON ANRUF" italicPart="bis" blackPart="ANSCHLUSS." color={COL.pink}>
      <FeatureGrid cols={4} palette={[COL.white, COL.yellow, COL.cyan, COL.white]} items={[
        { no: "01", tag: "TAG 0", title: "Anruf", body: "Ihr ruft an oder schreibt. Wir nehmen Eckdaten auf — 10 Minuten." },
        { no: "02", tag: "TAG 3-7", title: "Vor-Ort", body: "Wir kommen, gucken Dach, Zähler, Verbrauch. Vermessung & Foto." },
        { no: "03", tag: "TAG 14", title: "Angebot", body: "Festpreis, transparent. Mit Förder-Check und Wirtschaftlichkeitsrechnung." },
        { no: "04", tag: "TAG 30-60", title: "Montage", body: "Material da, Termin steht — wir bauen in 1–3 Tagen. Anschluss durch Netzbetreiber." },
      ]}/>
    </Section>
  );
}

function App() {
  return (
    <Page active="photovoltaik">
      <PageHero
        kapitel="LEISTUNG_01"
        kicker="PHOTOVOLTAIK"
        title="DACH"
        italicPart="macht"
        blackHeadlinePart="STROM."
        sub="Solaranlagen für Eigenheim und Gewerbe. Vollständige Planung, Montage durch eigene Monteure, Festpreis-Garantie. Bayern, Baden-Württemberg, bundesweit auf Anfrage."
        color={COL.yellow}
        accentColor={COL.pink}
        stickers={[
          { text: "★ Tier 1 Module", top: "12%", right: "5%", rot: 6, bg: COL.cyan },
          { text: "Festpreis ✓", top: "75%", left: "3%", rot: -4, bg: COL.pink },
        ]}
      />

      <Marquee items={["TIER 1 MODULE", "EIGENES TEAM", "FESTPREIS", "TÜV ✓", "30 J. GARANTIE", "MONITORING APP", "FÖRDERUNG INKL."]} />

      <Why />

      <Section kapitel="LEISTUNGSUMFANG" title="WAS DRIN" italicPart="ist im" blackPart="KOMPLETT-PAKET." color={COL.black}>
        <FeatureGrid cols={3} palette={[COL.pink, COL.cyan, COL.orange, COL.yellow, COL.pink, COL.cyan]} items={features}/>
      </Section>

      <Sizing />

      <Process />

      <BigQuote
        quote="Wir verlegen Solar seit 2014. Wir wissen, was bei welchem Dach funktioniert. Wir verbauen nichts, was wir nicht selbst auf der Mutter ihrem Haus hätten."
        by="Doris Pilsner-Albrecht"
        role="Inhaberin"
        color={COL.cyan}
      />

      <Cta
        kicker="JETZT_PV"
        big={<>BERATUNG.<br/><span style={{ fontFamily: fonts.serif, fontStyle: "italic", fontWeight: 400, textTransform: "lowercase" }}>kostenlos.</span> <span style={{ background: COL.pink, color: COL.black, padding: "0 .1em", display: "inline-block", transform: "skew(-4deg)" }}>FERTIG.</span></>}
        sub="30 Minuten am Telefon — und wir wissen, was geht. Vor-Ort kostet auch nichts."
      />
    </Page>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
