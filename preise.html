<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PREISE // SOLAR RADIKAL</title>
<meta name="description" content="Was kostet eine Photovoltaik-Anlage? Transparente Beispielrechnungen für Eigenheim und Gewerbe. Aus Deggendorf." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="radikal-base.css" />
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="subpage-shell.jsx"></script>
<script type="text/babel">
const { Page, PageHero, Section, BigQuote, FeatureGrid, Cta, Marquee, COL, fonts } = window.RadShell;

const examples = [
  { tag: "EIGENHEIM KLEIN", title: "8 kWp + 7 kWh Speicher", body: "Reihenhaus, 4-köpfige Familie, 4.500 kWh/J. Inkl. Wechselrichter, Montage, Förder-Antrag.", price: "ca. 18.500 €", monthly: "ab 145 €/M. Finanzierung", color: COL.cyan, save: "spart ~1.300 €/J." },
  { tag: "EIGENHEIM GROSS", title: "12 kWp + 12 kWh + Wallbox", body: "Einfamilienhaus, 5 Personen, E-Auto. Komplett-Setup mit Wärmepumpen-Vorbereitung.", price: "ca. 28.500 €", monthly: "ab 220 €/M.", color: COL.pink, save: "spart ~2.100 €/J." },
  { tag: "GEWERBE KLEIN", title: "50 kWp Halle", body: "Werkstatt, 60.000 kWh/J. PPA-Option möglich (0 € Investition).", price: "ca. 65.000 €", monthly: "oder PPA: 0 € invest", color: COL.yellow, save: "spart ~9.000 €/J." },
  { tag: "GEWERBE GROSS", title: "300 kWp Industrie", body: "Lagerhalle, 380.000 kWh/J. Typischerweise als PPA — keine eigene Investition.", price: "PPA: 0 €", monthly: "Festpreis 17 ct/kWh", color: COL.orange, save: "spart ~52.000 €/J." },
];

const ablauf = [
  { l: "BERATUNG", v: "0 €", s: "kostenlos, unverbindlich" },
  { l: "VOR-ORT-TERMIN", v: "0 €", s: "wir kommen kostenfrei" },
  { l: "ANGEBOT", v: "0 €", s: "Festpreis, transparent" },
  { l: "FÖRDER-CHECK", v: "0 €", s: "Bund + Land + Kommunal" },
];

function App() {
  return (
    <Page active="preise">
      <PageHero
        kapitel="WISSEN"
        kicker="WAS KOSTET SOLAR?"
        title="PREISE"
        italicPart="—"
        blackHeadlinePart="EHRLICH."
        sub="Transparente Beispielrechnungen für typische Anlagen-Größen. Endgültiger Preis hängt vom Dach, von Komponenten, von Förderung ab — aber das hier ist die Range."
        color={COL.yellow}
        accentColor={COL.pink}
        stickers={[
          { text: "Festpreis-Garantie", top: "12%", right: "5%", rot: 5, bg: COL.cyan },
          { text: "★ Keine versteckten Kosten", top: "78%", left: "3%", rot: -3, bg: COL.pink },
        ]}
      />

      <Marquee items={["FESTPREIS", "TRANSPARENT", "FÖRDERUNG INKL.", "FINANZIERUNG MÖGLICH", "PPA = 0€ INVEST"]} />

      <Section kapitel="BEISPIELE" title="VIER" italicPart="anlagen — vier" blackPart="PREISE." color={COL.cyan}>
        <p style={{ fontFamily: fonts.serif, fontSize: 22, fontStyle: "italic", maxWidth: 720, marginBottom: 32 }}>
          Realistische Preisrange je nach Anlagen-Typ. Inkl. Material, Montage, Wechselrichter, Speicher, Förder-Antrag. <strong>Förderung ist nicht eingerechnet</strong> — kann Preis um 10–30% reduzieren.
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 20 }}>
          {examples.map((e, i) => (
            <div key={i} className="lift" style={{ background: e.color, border: `3px solid ${COL.black}`, padding: 28, position: "relative", transform: `rotate(${[-0.5,0.5,-0.5,0.5][i]}deg)` }}>
              <div style={{ position: "absolute", top: -14, left: 14, background: COL.black, color: COL.yellow, padding: "4px 10px", fontFamily: fonts.mono, fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: ".05em" }}>{e.tag}</div>
              <h3 style={{ fontFamily: fonts.heading, fontSize: 32, fontWeight: 800, lineHeight: 0.95, textTransform: "uppercase", letterSpacing: "-0.02em", margin: "0 0 12px" }}>{e.title}</h3>
              <p style={{ fontFamily: fonts.serif, fontSize: 16, lineHeight: 1.4, margin: "0 0 20px", fontStyle: "italic" }}>{e.body}</p>
              <div style={{ borderTop: `2px dashed ${COL.black}`, paddingTop: 16 }}>
                <div style={{ fontFamily: fonts.mono, fontSize: 11, opacity: 0.7, textTransform: "uppercase" }}>► Komplettpreis</div>
                <div style={{ fontFamily: fonts.heading, fontSize: 56, fontWeight: 800, lineHeight: 1, letterSpacing: "-0.04em" }}>{e.price}</div>
                <div style={{ fontFamily: fonts.mono, fontSize: 12, marginTop: 6 }}>{e.monthly}</div>
                <div style={{ marginTop: 12, background: COL.black, color: COL.yellow, padding: "6px 12px", display: "inline-block", fontFamily: fonts.mono, fontSize: 12, fontWeight: 700 }}>★ {e.save}</div>
              </div>
            </div>
          ))}
        </div>
      </Section>

      <Section kapitel="ALLES_GRATIS" title="WAS" italicPart="dich" blackPart="NICHTS_KOSTET." color={COL.black} blackHeadlineColor={COL.cyan}>
        <p style={{ fontFamily: fonts.serif, fontSize: 22, fontStyle: "italic", maxWidth: 720, marginBottom: 32, color: COL.yellow }}>
          Bevor du auch nur einen Cent bezahlst — wir machen das alles kostenlos:
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", border: `3px solid ${COL.yellow}` }}>
          {ablauf.map((a, i) => (
            <div key={i} style={{ padding: 28, borderRight: i < 3 ? `1px solid ${COL.yellow}` : "none", color: COL.yellow }}>
              <div style={{ fontFamily: fonts.mono, fontSize: 11, fontWeight: 700, textTransform: "uppercase", marginBottom: 8, color: COL.cyan }}>► {a.l}</div>
              <div style={{ fontFamily: fonts.heading, fontWeight: 800, fontSize: 64, lineHeight: 1, color: COL.cyan }}>{a.v}</div>
              <div style={{ fontFamily: fonts.serif, fontStyle: "italic", fontSize: 14, marginTop: 10 }}>{a.s}</div>
            </div>
          ))}
        </div>
      </Section>

      <Section kapitel="FINANZIERUNG" title="WIE" italicPart="bezahlst" blackPart="DU?" color={COL.pink}>
        <FeatureGrid cols={3} palette={[COL.yellow, COL.cyan, COL.white]} items={[
          { no: "01", tag: "Klassiker", title: "Eigenkapital", body: "Du zahlst die Anlage komplett. Schnellste Amortisation, höchster Ertrag über die Lebensdauer." },
          { no: "02", tag: "Beliebt", title: "KfW-Kredit", body: "Wir machen den Antrag bei der KfW-270. Zinsgünstig, oft tilgungsfrei am Anfang. Rate < Strom-Ersparnis." },
          { no: "03", tag: "Gewerbe-Trick", title: "PPA = 0 €", body: "Bei Gewerbeanlagen: keine Investition. Wir bauen, du verbrauchst, zahlst den Strom. Cashflow ab Tag 1 positiv." },
        ]}/>
      </Section>

      <BigQuote
        quote="Wir machen Festpreis. Keine Nachforderung, keine Überraschung. Was im Angebot steht, gilt — auch wenns für uns mal eng wird."
        by="Doris Pilsner-Albrecht"
        role="Inhaberin"
        color={COL.orange}
      />

      <Cta
        kicker="JETZT_PREIS"
        big={<>DEIN<br/><span style={{ fontFamily: fonts.serif, fontStyle: "italic", fontWeight: 400, textTransform: "lowercase" }}>preis in</span> <span style={{ background: COL.pink, color: COL.black, padding: "0 .1em", display: "inline-block", transform: "skew(-4deg)" }}>30_MIN.</span></>}
        sub="Ein Anruf — und du weißt grob, was deine Anlage kostet. Schriftliches Angebot in 14 Tagen."
      />
    </Page>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
